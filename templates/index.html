<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Imobiliária R.M - Orçamentos</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f4f4; text-align: center; }
        .container { background: white; width: 400px; margin: 50px auto; padding: 20px; border-radius: 8px; box-shadow: 0px 0px 10px #ccc; }
        h2 { color: #333; }
        label { display: block; margin: 10px 0 5px; text-align: left; }
        select, input { width: 100%; padding: 8px; margin-bottom: 15px; border: 1px solid #ddd; border-radius: 4px; }
        button { background-color: #28a745; color: white; border: none; padding: 10px; width: 100%; cursor: pointer; border-radius: 4px; }
        button:hover { background-color: #218838; }
        .resultado { margin-top: 20px; padding: 15px; background: #e9ecef; border-left: 5px solid #28a745; text-align: left; }
    </style>
</head>
<body>
    <div class="container">
        <h2>Gerar Orçamento R.M</h2>
        <form method="POST">
            <label>Tipo de Imóvel:</label>
            <select name="tipo">
                <option value="Apartamento">Apartamento (R$ 700)</option>
                <option value="Casa">Casa (R$ 900)</option>
                <option value="Estúdio">Estúdio (R$ 1.200)</option>
            </select>

            <label>Quartos (1 ou 2):</label>
            <input type="number" name="quartos" min="1" max="2" value="1">

            <label>Parcelas do Contrato (até 5x):</label>
            <input type="number" name="parcelas" min="1" max="5" value="1">

            <button type="submit">Calcular Orçamento</button>
        </form>

        {% if resultado %}
        <div class="resultado">
            <strong>Resumo:</strong><br>
            Aluguel: R$ {{ resultado.aluguel }}<br>
            Taxa de Contrato: {{ resultado.parcelas }}x de R$ {{ resultado.valor_parcela }}<br>
            <strong>Total 1º Mês: R$ {{ resultado.total }}</strong>
        </div>
        {% endif %}
    </div>
</body>
</html>
